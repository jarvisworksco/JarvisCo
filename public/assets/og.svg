  <text x="96" y="300" font-family="Verdana, Geneva, sans-serif" font-size="72" font-weight="700" fill="#EDEFEC">Svetainės, kurios</text>
  <text x="96" y="386" font-family="Verdana, Geneva, sans-serif" font-size="72" font-weight="700" fill="url(#lime)">pritraukia klientų.</text>

  <text x="96" y="452" font-family="Verdana, Geneva, sans-serif" font-size="29" fill="#9AA0A0">Konversijai pritaikytas web dizainas ir augimo automatizacijos</text>
  <text x="96" y="490" font-family="Verdana, Geneva, sans-serif" font-size="29" fill="#9AA0A0">paslaugų verslams visoje Lietuvoje.</text>

