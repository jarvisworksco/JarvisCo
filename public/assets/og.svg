    <circle cx="40" cy="16" r="4" fill="#C6F24E"/>
    <text x="84" y="44" font-family="Verdana, sans-serif" font-size="30" font-weight="700" fill="#EDEFEC">Jarvis<tspan fill="#C6F24E">Co</tspan></text>
